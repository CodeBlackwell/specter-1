# chrony configuration for specter-1 swarm nodes.
#
# Time synchronization is a Phase 1 entry blocker: `validate_timestamp`
# rejects envelopes outside ±5s skew. Without OS-level sync, two robots
# starting from different boot times will instantly exceed the threshold
# and tag every peer message as `clock_skew_*`.
#
# Verification:
#   chronyc tracking          # offset should converge within ~100ms
#   chronyc sources           # at least one peer should be marked '^*'
#
# Place at /etc/chrony/chrony.conf (Ubuntu/Debian) or
# /etc/chrony.conf (RHEL/Fedora) and `systemctl restart chronyd`.

# Use the public NTP pool. For air-gapped deployments, point at an
# operator-controlled stratum-1 GPS receiver instead.
pool pool.ntp.org iburst maxsources 4

# Drift file persists clock-rate corrections across reboots.
driftfile /var/lib/chrony/drift

# Make a large initial step on startup if the offset > 1s; only allow
# during the first 3 updates so we don't routinely jump live time.
makestep 1.0 3

# Sync the RTC from the system clock so a power loss + cold boot lands
# close to current time even before NTP responds.
rtcsync

# Bind to all interfaces (default). Restrict if the swarm runs on an
# isolated subnet — `bindcmdaddress 127.0.0.1` would prevent control
# from outside the host.

# Allow chronyc commands from local sockets only.
cmdport 0
