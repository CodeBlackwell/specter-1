[project]
name = "specter"
version = "0.1.0"
description = "Byzantine-resilient cooperative SLAM — signed-envelope swarm with per-peer Beta(α,β) reputation and range-only trust voting"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "LeChristopher Blackwell", email = "codeblackwell@gmail.com" },
]
keywords = [
    "slam",
    "swarm",
    "byzantine-fault-tolerance",
    "robotics",
    "ros2",
    "trust",
    "reputation",
    "cooperative-mapping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "cryptography>=42",
    "protobuf>=5",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/codeblackwell/specter-1"
Repository = "https://github.com/codeblackwell/specter-1"
Issues = "https://github.com/codeblackwell/specter-1/issues"

[project.optional-dependencies]
viz = ["pygame>=2.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
workshop = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "ipywidgets>=8.0",
    "scipy>=1.11",
    "nbclient>=0.10",
]
# NOTE: rclpy + sensor_msgs are NOT pip-installable; they ship with the ROS2
# distribution (Humble or later). To run agent_node / dashboard_node / launch
# files: install ROS2 system-wide, source `/opt/ros/humble/setup.bash`, and
# run from that environment instead of uv. Pure-Python parts (adapters'
# translation functions, RosterLoader, gen_roster) work without ROS2.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "specter.viz.notebook"
ignore_errors = true

[[tool.mypy.overrides]]
module = "specter.viz.pygame_viz"
ignore_errors = true

[[tool.mypy.overrides]]
module = "specter.viz.dashboard.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
